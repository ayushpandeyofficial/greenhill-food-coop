{% extends "base.html" %}

{% block title %}
Register | Greenhill Food Co-op
{% endblock %}


{% block content %}

<section class="auth-page">

    <div class="auth-card">

        <h1>Join the Co-op 🌱</h1>

        <p class="subtitle">
            Create your member account to start ordering.
        </p>


        {% if error %}

            <div class="message error">
                {{ error }}
            </div>

        {% endif %}


        <form method="POST">

            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn btn-primary"
            >
                Create My Account
            </button>

        </form>


        <div class="auth-links">

            Already have an account?

            <a href="/login">
                Login here
            </a>

        </div>

    </div>

</section>

{% endblock %}
