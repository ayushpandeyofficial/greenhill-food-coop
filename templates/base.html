<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}Greenhill Food Co-op{% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

    <nav class="navbar">

        <a class="brand" href="/">
            🌱 Greenhill Food Co-op
        </a>

        <div class="nav-links">

            <a href="/">Home</a>

            {% if session.get("member_id") %}

                <a href="/dashboard">Dashboard</a>

                <a href="/logout">Logout</a>

            {% else %}

                <a href="/login">Login</a>

                <a href="/register">Register</a>

            {% endif %}

        </div>

    </nav>


    {% block content %}
    {% endblock %}


    <footer>
        <p>
            🌱 Greenhill Food Co-op © 2026 |
            Community grocery ordering made simple
        </p>
    </footer>

</body>
</html>
